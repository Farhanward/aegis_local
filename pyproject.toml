[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-local"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Verifiable local agent gate with Ed25519 signed audit ledger."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools]
packages = ["aegis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
